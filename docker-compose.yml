# ═══════════════════════════════════════════════════════════════
# El Depósito — orquestación para el VPS (y pruebas locales).
#
#   docker compose up -d --build            → solo la web (BD en Supabase)
#   docker compose --profile db up -d       → web + Postgres propio (VPS)
#
# Las variables se leen de .env (ver .env.example).
# ═══════════════════════════════════════════════════════════════
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Postgres propio para cuando se migre al VPS. Inactivo por defecto.
  db:
    image: postgres:17-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: deposito
      POSTGRES_USER: deposito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deposito"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
